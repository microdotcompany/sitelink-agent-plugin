name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON parses
        run: jq empty plugin.json mcp.json .claude-plugin/plugin.json .mcp.json
      - name: Versions match
        run: |
          portable=$(jq -r .version plugin.json)
          claude=$(jq -r .version .claude-plugin/plugin.json)
          skill=$(sed -n 's/^  version: //p' skills/sitelink/SKILL.md)
          echo "portable=$portable claude=$claude skill=$skill"
          [ "$portable" = "$skill" ] && [ "$claude" = "$skill" ]
      - name: Skill under 300 lines
        run: '[ "$(wc -l < skills/sitelink/SKILL.md)" -le 300 ]'
      - name: No forbidden files
        run: |
          ! find . -name .DS_Store -o -type l -not -path './.git/*' | grep .
          [ ! -f .gitmodules ]
